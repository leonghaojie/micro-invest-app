services:
  db:
    image: postgres:16
    container_name: micro-invest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: micro_invest
    ports:
      - "5432:5432"
    volumes:
      - micro-invest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d micro_invest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  micro-invest-db-data:
